<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container {
            background-color: antiquewhite;
            display: flex;
            flex-flow: row nowrap;       
         }

        .item {
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
<body>
    <div class="container">
        <div class="item">Aaaaaa</div>
        <div class="item">Bbbbbbbbbbbbbbbbbb</div>
        <div class="item">Cccccccc</div>
        <div class="item">Dddddddddd</div>
        <div class="item">Eee</div>
        <div class="item">Ffffff</div>
        <div class="item">Gggggggggggggg</div>
    </div>
</body>
</html>
