<!DOCTYPE html>
<html lang="pr-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="POST" autocomplete="on">
    <p>
        <label for="iusu">Usuário </label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="10" placeholder="Nome Completo" autocomplete="username">
    </p>
    <p>
        <label for="ipass">Password </label>
        <input type="password" name="pass" id="ipass" required minlength="8" maxlength="12" size="8" placeholder="mínimo 8 caracteres" autocomplete="current-password">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limar">
    </p>
    </form>
</body>
</html>
